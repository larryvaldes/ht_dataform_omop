version: 2
models:
  - name: omop__procedure_occurrence
    description: This table contains records of activities or processes ordered by, or carried out by, a healthcare provider on the patient with a diagnostic or therapeutic purpose.
    tests:
      - person_completeness:
          arguments:
            threshold: '95'
      - source_value_populated:
          config:
            severity: warn
            tags: ['conformance']
          arguments:
            concept_column: procedure_concept_id
            source_value_column: procedure_source_value
    columns:
      - name: procedure_occurrence_id
        description: The unique key given to a procedure record for a person. Refer to the ETL for how duplicate procedures during the same visit were handled.
        data_type: integer
        tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error
                tags: ['conformance']
        constraints:
          - type: primary_key
      - name: person_id
        description: The PERSON_ID of the PERSON for whom the procedure is recorded. This may be a system generated code.
        data_type: integer
        tests:
          - not_null
          - relationships:
              config:
                severity: error
              arguments:
                to: ref('omop__person')
                field: person_id
        constraints:
          - type: foreign_key
            to: ref('omop__person')
            to_columns: [person_id]
      - name: procedure_concept_id
        description: The PROCEDURE_CONCEPT_ID field is recommended for primary use in analyses, and must be used for network studies. This is the standard concept mapped from the source value which represents a procedure
        data_type: integer
        tests:
          - not_null
          - domain_routing_valid:
              config:
                severity: error
                tags: ['conformance']
              arguments:
                expected_domain: Procedure
          - dbt_utils.relationships_where:
              config:
                severity: error
              arguments:
                to: ref('stg_raw_athena__concept')
                field: concept_id
                from_condition: procedure_concept_id <> 0
                to_condition: domain_id = 'Procedure'
          - concept_zero_rate:
              arguments:
                threshold: '36'
          - dbt_utils.relationships_where:
              config:
                severity: error
              arguments:
                to: ref('stg_raw_athena__concept')
                field: concept_id
                from_condition: procedure_concept_id != 0
                to_condition: standard_concept = 'S' AND invalid_reason IS NULL
        constraints:
          - type: foreign_key
            to: ref('omop__concept')
            to_columns: [concept_id]
      - name: procedure_date
        description: Use this date to determine the date the procedure started.
        data_type: date
        tests:
          - not_null
          - date_not_in_future
          - date_not_after:
              arguments:
                after_column: procedure_end_date
          - outside_observation_period
      - name: procedure_datetime
        description: ''
        data_type: TIMESTAMP
      - name: procedure_end_date
        description: Use this field to house the date that the procedure ended.
        data_type: date
      - name: procedure_end_datetime
        description: Use this field to house the datetime that the procedure ended.
        data_type: TIMESTAMP
      - name: procedure_type_concept_id
        description: This field can be used to determine the provenance of the Procedure record, as in whether the procedure was from an EHR system, insurance claim, registry, or other sources.
        data_type: integer
        tests:
          - not_null
          - type_concept_valid:
              config:
                severity: error
                tags: ['conformance']
          - dbt_utils.relationships_where:
              config:
                severity: error
              arguments:
                to: ref('stg_raw_athena__concept')
                field: concept_id
                from_condition: procedure_type_concept_id <> 0
                to_condition: domain_id = 'Type Concept'
          - concept_zero_rate:
              arguments:
                threshold: '0'
          - dbt_utils.relationships_where:
              config:
                severity: error
              arguments:
                to: ref('stg_raw_athena__concept')
                field: concept_id
                from_condition: procedure_type_concept_id != 0
                to_condition: standard_concept = 'S' AND invalid_reason IS NULL
        constraints:
          - type: foreign_key
            to: ref('omop__concept')
            to_columns: [concept_id]
      - name: modifier_concept_id
        description: The modifiers are intended to give additional information about the procedure but as of now the vocabulary is under review.
        data_type: integer
        tests:
          - relationships:
              config:
                severity: error
              arguments:
                to: ref('stg_raw_athena__concept')
                field: concept_id
          - concept_zero_rate:
              # 100% unmapped expected: OMOP modifier vocabulary is under review
              arguments:
                threshold: '100'
          - dbt_utils.relationships_where:
              config:
                severity: error
              arguments:
                to: ref('stg_raw_athena__concept')
                field: concept_id
                from_condition: modifier_concept_id != 0
                to_condition: standard_concept = 'S' AND invalid_reason IS NULL
        constraints:
          - type: foreign_key
            to: ref('omop__concept')
            to_columns: [concept_id]
      - name: quantity
        description: If the quantity value is omitted, a single procedure is assumed.
        data_type: integer
      - name: provider_id
        description: The provider associated with the procedure record, e.g. the provider who performed the Procedure.
        data_type: integer
        tests:
          - relationships:
              config:
                severity: error
              arguments:
                to: ref('omop__provider')
                field: provider_id
          - fk_null_rate:
              config:
                severity: warn
              arguments:
                threshold: 89
        constraints:
          - type: foreign_key
            to: ref('omop__provider')
            to_columns: [provider_id]
      - name: visit_occurrence_id
        description: The visit during which the procedure occurred.
        data_type: integer
        tests:
          - relationships:
              config:
                severity: error
              arguments:
                to: ref('omop__visit_occurrence')
                field: visit_occurrence_id
          - fk_null_rate:
              config:
                severity: warn
              arguments:
                threshold: 24
        constraints:
          - type: foreign_key
            to: ref('omop__visit_occurrence')
            to_columns: [visit_occurrence_id]
      - name: visit_detail_id
        description: The VISIT_DETAIL record during which the Procedure occurred. For example, if the Person was in the ICU at the time of the Procedure the VISIT_OCCURRENCE record would reflect the overall hospital stay and the VISIT_DETAIL record would reflect the ICU stay during the hospital visit.
        data_type: integer
        constraints:
          - type: foreign_key
            to: ref('omop__visit_detail')
            to_columns: [visit_detail_id]
      - name: procedure_source_value
        description: This field houses the verbatim value from the source data representing the procedure that occurred. For example, this could be an CPT4 or OPCS4 code.
        data_type: STRING
      - name: procedure_source_concept_id
        description: This is the concept representing the procedure source value and may not necessarily be standard. This field is discouraged from use in analysis because it is not required to contain Standard Concepts that are used across the OHDSI community, and should only be used when Standard Concepts do not adequately represent the source detail for the Procedure necessary for a given analytic use case. Consider using PROCEDURE_CONCEPT_ID instead to enable standardized analytics that can be consistent across the network.
        data_type: integer
        tests:
          - relationships:
              config:
                severity: error
              arguments:
                to: ref('stg_raw_athena__concept')
                field: concept_id
          - concept_zero_rate:
              arguments:
                threshold: '37'
        constraints:
          - type: foreign_key
            to: ref('omop__concept')
            to_columns: [concept_id]
      - name: modifier_source_value
        description: This field houses the verbatim value from the source data representing the modifier code for the procedure that occurred.
        data_type: STRING