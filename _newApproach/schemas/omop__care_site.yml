version: 2
models:
  - name: omop__care_site
    description: The CARE_SITE table contains a list of uniquely identified institutional (physical or organizational) units where healthcare delivery is practiced (offices, wards, hospitals, clinics, etc.). Sourced from EHR organization data embedded in FHIR clinical resources.
    columns:
      - name: care_site_id
        description: Assigned to each unique combination of location and institutional affiliation. Generated deterministically from organization_id.
        data_type: integer
        tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error
                tags: ['conformance']
        constraints:
          - type: primary_key
      - name: care_site_name
        description: The verbatim description or name of the Care Site as in data source.
        data_type: STRING
        tests:
          - not_null
      - name: place_of_service_concept_id
        description: This is a high-level way of characterizing a Care Site. Currently 0 as OMOP place-of-service concepts represent physical settings, not organization types. Use int_facility__organization.organization_category for Academic/Research, Community, or Integrated Network classification.
        data_type: integer
        tests:
          - not_null
          - domain_routing_valid:
              config:
                severity: error
                tags: ['conformance']
              arguments:
                expected_domain: Visit
        constraints:
          - type: foreign_key
            to: ref('omop__concept')
            to_columns: [concept_id]
      - name: location_id
        description: The location of the Care Site. Currently NULL as facility address data is not reliably available.
        data_type: integer
        tests:
          - relationships:
              config:
                severity: error
                tags: ['conformance']
              arguments:
                to: ref('omop__location')
                field: location_id
          # Intentionally permissive: care sites from EHR references may lack geocoded locations
          - fk_null_rate:
              config:
                severity: warn
              arguments:
                threshold: 100
        constraints:
          - type: foreign_key
            to: ref('omop__location')
            to_columns: [location_id]
      - name: care_site_source_value
        description: The identifier for the Care Site in the source data, corresponding to the EHR organization ID from recordProviderInfo.
        data_type: STRING
      - name: place_of_service_source_value
        description: >
          The source code for the Place of Service as it appears in the source data,
          corresponding to the organization_category from the facility classification.
